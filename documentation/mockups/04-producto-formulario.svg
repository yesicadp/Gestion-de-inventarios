ar / editar)</text><text x="24" y="850" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a8a8a" text-anchor="start">Wireframe de baja fidelidad — solo referencia de estructura y contenido, no de estilo visual final.</text></svg>