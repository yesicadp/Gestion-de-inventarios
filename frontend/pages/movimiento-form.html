
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimientos - Gestión de Inventarios</title>

  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/components/dashboard.css">
  <link rel="stylesheet" href="../css/components/productos.css">
  <link rel="stylesheet" href="../css/components/movimientos.css">
</head>
<body class="app-body">

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Gestión de Inventarios</div>
      <nav>
        <a href="dashboard.html">Panel principal</a>
        <a href="productos.html">Productos</a>
        <a href="categorias.html">Categorías</a>
        <a href="inventario.html">Inventario</a>
        <a href="movimiento-form.html" class="active">Movimientos</a>
        <a href="historial.html">Historial</a>
        <a href="usuarios.html" data-solo-admin>Usuarios</a>
        <a href="auditoria.html" data-solo-admin>Auditoría</a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="user-info">
          <span>Hola, <strong id="user-name">—</strong></span>
          <span class="role-badge" id="user-role">—</span>
        </div>
        <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </header>

      <main class="content">
        <h1>Movimientos de inventario</h1>

        <section class="panel products-panel movement-panel">
          <h2>Registrar movimiento</h2>

          <form id="form-movimiento">
            <div class="movement-form-grid">

              <div class="movement-field">
                <label for="producto-movimiento">Producto</label>
                <select id="producto-movimiento" required>
                  <option value="">Selecciona un producto</option>
                </select>
              </div>

              <div class="movement-field">
                <label for="tipo-movimiento">Tipo de movimiento</label>
                <select id="tipo-movimiento" required>
                  <option value="">Selecciona el tipo</option>
                  <option value="ENTRADA">Entrada</option>
                  <option value="SALIDA">Salida</option>
                </select>
              </div>

              <div class="movement-field">
                <label for="cantidad-movimiento">Cantidad</label>
                <input
                  type="number"
                  id="cantidad-movimiento"
                  min="1"
                  step="1"
                  placeholder="Ingresa la cantidad"
                  required
                >
              </div>

              <div class="movement-field">
                <label>Existencia actual</label>
                <input
                  type="text"
                  id="existencia-actual"
                  value="Selecciona un producto"
                  readonly
                >
              </div>

              <div class="movement-field movement-field-full">
                <label for="motivo-movimiento">Motivo</label>
                <textarea
                  id="motivo-movimiento"
                  rows="3"
                  maxlength="255"
                  placeholder="Describe el motivo del movimiento"
                  required
                ></textarea>
              </div>

            </div>

            <p
              id="mensaje-movimiento"
              class="products-message"
              role="status"
              aria-live="polite"
            >
              Cargando productos...
            </p>

            <div class="movement-actions">
              <button type="submit" id="btn-registrar-movimiento" class="btn-primary">
                Registrar movimiento
              </button>

              <button type="reset" class="btn-secondary">
                Limpiar formulario
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/sesion.js"></script>
  <script src="../js/movimiento-form.js"></script>
</body>
</html>
