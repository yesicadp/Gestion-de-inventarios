
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Gestión de Inventarios</title>

  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/components/dashboard.css">
  <link rel="stylesheet" href="../css/components/categorias.css">
</head>
<body class="app-body">

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Gestión de Inventarios</div>
      <nav>
        <a href="dashboard.html">Panel principal</a>
        <a href="productos.html">Productos</a>
        <a href="categorias.html" class="active">Categorías</a>
        <a href="inventario.html">Inventario</a>
        <a href="movimiento-form.html">Movimientos</a>
        <a href="historial.html">Historial</a>
        <a href="usuarios.html" data-solo-admin>Usuarios</a>
        <a href="auditoria.html" data-solo-admin>Auditoría</a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="user-info">
          <span>Hola, <strong id="user-name">—</strong></span>
          <span class="role-badge" id="user-role">—</span>
        </div>
        <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </header>

      <main class="content">
        <h1>Categorías</h1>
        <p class="subtitle">Organiza y administra las categorías de los productos del inventario.</p>

        <section class="panel categories-panel">
          <div class="categories-toolbar">
            <input
              type="search"
              id="buscar-categoria"
              placeholder="Buscar categoría por nombre"
              aria-label="Buscar categorías"
            >

            <button type="button" id="btn-nueva-categoria" class="btn-primary">
              + Nueva categoría
            </button>
          </div>

          <form id="form-categoria" class="category-form hidden">
            <h2 id="titulo-formulario">Nueva categoría</h2>

            <div class="category-form-fields">
              <div class="form-field">
                <label for="nombre-categoria">Nombre de la categoría *</label>
                <input
                  type="text"
                  id="nombre-categoria"
                  name="nombre"
                  maxlength="100"
                  placeholder="Ej. Papelería"
                  required
                >
              </div>

              <div class="form-field">
                <label for="categoria-padre">Categoría principal</label>
                <select id="categoria-padre" name="categoria_padre_id">
                  <option value="">Sin categoría principal</option>
                </select>
              </div>
            </div>

            <p id="mensaje-formulario" class="category-message" role="status"></p>

            <div class="category-form-actions">
              <button type="submit" class="btn-primary" id="btn-guardar-categoria">
                Guardar categoría
              </button>
              <button type="button" id="btn-cancelar-categoria" class="btn-secondary">
                Cancelar
              </button>
            </div>
          </form>

          <p id="mensaje-categorias" class="category-message" role="status">
            Cargando categorías...
          </p>

          <div class="table-container">
            <table class="categories-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Categoría principal</th>
                </tr>
              </thead>
              <tbody id="tabla-categorias">
              </tbody>
            </table>
          </div>

          <div class="categories-footer">
            <span id="contador-categorias">0 categorías</span>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/dashboard.js"></script>
  <script src="../js/categorias.js"></script>
</body>
</html>
