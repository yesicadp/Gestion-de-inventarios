
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Gestión de Inventarios</title>

  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/components/dashboard.css">
  <link rel="stylesheet" href="../css/components/usuarios.css">
</head>
<body class="app-body">

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Gestión de Inventarios</div>
      <nav>
        <a href="dashboard.html">Panel principal</a>
        <a href="productos.html">Productos</a>
        <a href="categorias.html">Categorías</a>
        <a href="inventario.html">Inventario</a>
        <a href="movimiento-form.html">Movimientos</a>
        <a href="historial.html">Historial</a>
        <a href="usuarios.html" class="active" data-solo-admin>Usuarios</a>
        <a href="auditoria.html" data-solo-admin>Auditoría</a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="user-info">
          <span>Hola, <strong id="user-name">—</strong></span>
          <span class="role-badge" id="user-role">—</span>
        </div>
        <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </header>

      <main class="content">
        <h1>Administración de usuarios</h1>
        <section class="panel users-panel">

          <div class="users-toolbar">
            <input
              type="search"
              id="buscar-usuario"
              placeholder="Buscar por nombre o correo"
              aria-label="Buscar usuarios"
            >

            <button type="button" id="btn-nuevo-usuario" class="btn-primary">
              + Nuevo usuario
            </button>
          </div>

          <form id="form-usuario" class="user-form hidden">
            <h2 id="titulo-formulario">Nuevo usuario</h2>

            <div class="user-form-grid">
              <div class="form-field">
                <label for="nombre-usuario">Nombre completo *</label>
                <input
                  type="text"
                  id="nombre-usuario"
                  maxlength="100"
                  placeholder="Nombre del usuario"
                  required
                >
              </div>

              <div class="form-field">
                <label for="correo-usuario">Correo electrónico *</label>
                <input
                  type="email"
                  id="correo-usuario"
                  maxlength="150"
                  placeholder="usuario@correo.com"
                  required
                >
              </div>

              <div class="form-field">
                <label for="rol-usuario">Rol *</label>
                <select id="rol-usuario" required>
                  <option value="">Selecciona un rol</option>
                </select>
              </div>

              <div class="form-field">
                <label for="password-usuario" id="label-password">
                  Contraseña *
                </label>
                <input
                  type="password"
                  id="password-usuario"
                  minlength="8"
                  placeholder="Mínimo 8 caracteres"
                >
                <small id="ayuda-password">
                  La contraseña debe tener al menos 8 caracteres.
                </small>
              </div>
            </div>

            <p id="mensaje-formulario" class="users-message" role="status"></p>

            <div class="user-form-actions">
              <button type="submit" id="btn-guardar-usuario" class="btn-primary">
                Guardar usuario
              </button>
              <button type="button" id="btn-cancelar-usuario" class="btn-secondary">
                Cancelar
              </button>
            </div>
          </form>

          <p id="mensaje-usuarios" class="users-message" role="status">
            Cargando usuarios...
          </p>

          <div class="table-container">
            <table class="users-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-usuarios"></tbody>
            </table>
          </div>

          <div class="users-footer">
            <span id="contador-usuarios">0 usuarios</span>
          </div>

        </section>
      </main>
    </div>
  </div>

  <script src="../js/sesion.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
