
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Gestión de Inventarios</title>

  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/components/dashboard.css">
  <link rel="stylesheet" href="../css/components/inventario.css">
</head>
<body class="app-body">

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Gestión de Inventarios</div>
      <nav>
        <a href="dashboard.html">Panel principal</a>
        <a href="productos.html">Productos</a>
        <a href="categorias.html">Categorías</a>
        <a href="inventario.html" class="active">Inventario</a>
        <a href="movimiento-form.html">Movimientos</a>
        <a href="historial.html">Historial</a>
        <a href="usuarios.html" data-solo-admin>Usuarios</a>
        <a href="auditoria.html" data-solo-admin>Auditoría</a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="user-info">
          <span>Hola, <strong id="user-name">—</strong></span>
          <span class="role-badge" id="user-role">—</span>
        </div>
        <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </header>

      <main class="content">
        <h1>Inventario</h1>
        <section class="panel inventory-panel">

          <div class="inventory-summary">
            <div class="inventory-summary-card">
              <span>Total de productos</span>
              <strong id="total-productos">0</strong>
            </div>

            <div class="inventory-summary-card">
              <span>Existencias bajas</span>
              <strong id="total-bajos">0</strong>
            </div>
          </div>

          <div class="inventory-toolbar">
            <input
              type="search"
              id="buscar-inventario"
              placeholder="Buscar por nombre o código"
              aria-label="Buscar productos"
            >

            <select id="filtro-categoria" aria-label="Filtrar por categoría">
              <option value="">Todas las categorías</option>
            </select>

            <select id="filtro-existencia" aria-label="Filtrar por existencia">
              <option value="">Todas las existencias</option>
              <option value="1">Existencias bajas</option>
              <option value="0">Existencias normales</option>
            </select>
          </div>

          <p id="mensaje-inventario" class="inventory-message" role="status">
            Cargando inventario...
          </p>

          <div class="table-container">
            <table class="inventory-table">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Producto</th>
                  <th>Categoría</th>
                  <th>Existencia actual</th>
                  <th>Existencia mínima</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="tabla-inventario">
              </tbody>
            </table>
          </div>

          <div class="inventory-footer">
            <span id="contador-inventario">0 productos</span>
          </div>

        </section>
      </main>
    </div>
  </div>

  <script src="../js/sesion.js"></script>
  <script src="../js/inventario.js"></script>
</body>
</html>
